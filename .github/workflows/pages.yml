name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Assemble static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          # Disable Jekyll so files/dirs starting with underscores are served as-is.
          touch _site/.nojekyll
          # Core pages
          cp index.html _site/
          cp -f style.css _site/ 2>/dev/null || true
          cp -f spec.html _site/ 2>/dev/null || true
          cp -f nexus-omega-enhanced.html _site/ 2>/dev/null || true
          cp -f README.md _site/ 2>/dev/null || true
          cp -f Logo.png _site/ 2>/dev/null || true
          # Asset + docs trees referenced by index.html
          cp -r assets _site/assets
          cp -r docs _site/docs
          echo "Assembled site:"
          find _site -maxdepth 2 -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy-site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
